<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In | DreamGarage</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* LEFT PANEL */
    .auth-left {
      background: var(--charcoal);
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      padding: 80px 70px;
      position: relative; overflow: hidden;
    }
    .auth-left::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 30% 70%, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-left-logo { margin-bottom: 60px; position: relative; z-index: 1; }
    .auth-left h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      font-weight: 300; line-height: 1.15;
      margin-bottom: 20px; position: relative; z-index: 1;
    }
    .auth-left h2 em { font-style: italic; color: var(--gold); }
    .auth-left p { color: var(--muted); font-size: 0.9rem; line-height: 1.8; max-width: 340px; position: relative; z-index: 1; }

    .auth-features { margin-top: 50px; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 1; }
    .auth-feature { display: flex; align-items: center; gap: 14px; }
    .auth-feature-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold); flex-shrink: 0;
    }
    .auth-feature span { font-size: 0.85rem; color: var(--muted); }

    .auth-car-art {
      position: absolute; bottom: 40px; right: -20px;
      opacity: 0.08; pointer-events: none;
    }

    /* RIGHT PANEL */
    .auth-right {
      background: var(--black);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 80px 70px;
    }
    .auth-form-wrap { width: 100%; max-width: 400px; }

    .auth-form-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem; font-weight: 400;
      margin-bottom: 8px;
    }
    .auth-form-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 40px; }
    .auth-form-sub a { color: var(--gold); text-decoration: none; }

    /* FORM */
    .form-group { margin-bottom: 22px; }
    .form-group label {
      display: block; font-size: 0.7rem; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    .form-group input {
      width: 100%; background: var(--charcoal); border: 1px solid var(--border);
      color: var(--white); padding: 14px 16px; font-size: 0.9rem;
      font-family: 'Inter', sans-serif; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--gold); }
    .form-group input::placeholder { color: var(--border); }

    .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .remember-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .remember-wrap input[type="checkbox"] { accent-color: var(--gold); width: 14px; height: 14px; }
    .remember-wrap span { font-size: 0.8rem; color: var(--muted); }
    .forgot-link { font-size: 0.8rem; color: var(--gold); text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-full { width: 100%; padding: 15px; font-size: 0.82rem; letter-spacing: 2px; }

    .auth-divider {
      display: flex; align-items: center; gap: 14px;
      margin: 28px 0; color: var(--border); font-size: 0.75rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .btn-google {
      width: 100%; background: transparent; border: 1px solid var(--border);
      color: var(--white); padding: 14px; font-size: 0.82rem;
      font-family: 'Inter', sans-serif; cursor: pointer; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: border-color 0.2s;
    }
    .btn-google:hover { border-color: var(--muted); }

    /* Error / success messages */
    .msg { padding: 12px 16px; font-size: 0.82rem; margin-bottom: 20px; display: none; }
    .msg.error { background: rgba(192,57,43,0.15); border: 1px solid var(--danger); color: #e74c3c; }
    .msg.success { background: rgba(39,174,96,0.15); border: 1px solid var(--success); color: #2ecc71; }
    .msg.show { display: block; }

    /* Loading spinner inside button */
    .spinner {
      width: 14px; height: 14px; border: 2px solid transparent;
      border-top-color: var(--black); border-radius: 50%;
      animation: spin 0.6s linear infinite; display: none;
    }

    @media (max-width: 800px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-left { display: none; }
      .auth-right { padding: 60px 28px; }
    }
  </style>
</head>
<body>

<div class="auth-page">

  <!-- LEFT PANEL -->
  <div class="auth-left">
    <div class="auth-left-logo">
      <a href="/" class="logo">Dream<span>Garage</span></a>
    </div>
    <h2>Welcome<br>back to your<br><em>garage</em></h2>
    <p>Sign in to customize cars, place orders and track your order status.</p>

    <div class="auth-features">
      <div class="auth-feature"><div class="auth-feature-dot"></div><span>Customize any car with live pricing</span></div>
      <div class="auth-feature"><div class="auth-feature-dot"></div><span>Place your order online</span></div>
      <div class="auth-feature"><div class="auth-feature-dot"></div><span>Track your order status</span></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="auth-right">
    <div class="auth-form-wrap fade-up">
      <h2 class="auth-form-title">Sign In</h2>
      <p class="auth-form-sub">New here? <a href="/register">Create a free account</a></p>

      <div class="msg error" id="errorMsg"></div>
      <div class="msg success" id="successMsg"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required/>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>

        <button type="submit" class="btn-primary btn-full" id="loginBtn" style="margin-top:8px">
          <span id="loginBtnText">Sign In</span>
          <div class="spinner" id="loginSpinner"></div>
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  const form       = document.getElementById('loginForm');
  const errorMsg   = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const loginBtn   = document.getElementById('loginBtn');
  const spinner    = document.getElementById('loginSpinner');
  const btnText    = document.getElementById('loginBtnText');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Basic validation
    if (!email || !password) {
      showError('Please fill in all fields.');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('Please enter a valid email address.');
      return;
    }
    if (password.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    // Show loading
    btnText.style.display = 'none';
    spinner.style.display = 'block';
    loginBtn.disabled = true;

    try {
      // POST to Flask backend
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, next: new URLSearchParams(location.search).get('next') })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showSuccess('Login successful! Redirecting…');
        setTimeout(() => window.location.href = data.redirect || '/dashboard', 1200);
      } else {
        showError(data.message || 'Invalid email or password.');
      }
    } catch {
      showError('Cannot reach the server. Is app.py running?');
    } finally {
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
      loginBtn.disabled = false;
    }
  });

  function showError(msg)   { errorMsg.textContent   = msg; errorMsg.classList.add('show');   }
  function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.add('show'); }

  // Navbar scroll
  window.addEventListener('scroll', () => {
    document.querySelector('nav')?.classList.toggle('scrolled', window.scrollY > 60);
  });
</script>

</body>
</html>
